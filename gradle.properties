org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.253
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Mod
mod_id=mekanismadvancedgenerators
mod_name=Mekanism Advanced Generators
mod_version=2.3.1
mod_group_id=com.pockyl.mekanismadvancedgenerators
mod_license=MIT
mod_authors=Pocky
mod_description=Advanced and big solar panels, energy cubes, universal cables and energy tablets for Mekanism.
mod_url=https://github.com/Pocky-l/Mekanism-MoreSolarPanels

## Dependencies
# Mekanism and Mekanism Generators (one maven artifact, classifier "generators").
mekanism_version=10.7.19.85
# Lowest Mekanism the mod works with (10.7.0-10.7.10 have a different internal API); no upper bound, so newer
# releases load. Checked with tools/compat/maven_matrix.py, see the mod notes.
mekanism_version_range=[10.7.11,)
jei_version=19.27.0.340
jade_version=15.10.6+neoforge

## CurseForge
# Numeric project ID from the CurseForge project page ("About Project" sidebar).
curseforge_project_id=844063
curseforge_client=true
curseforge_server=true
# Comma-separated CurseForge project slugs.
curseforge_requires=mekanism,mekanism-generators
curseforge_optional=jade
